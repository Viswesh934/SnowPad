[project]
name = "snowpad"
version = "0.1.0"
description = "SnowPad - Developer Impact & Tech Debt OS with Circle-of-Scope Intelligence powered by DuckDB & Switch"
readme = "README.md"
authors = [
    { name = "Viswesh", email = "sigireddyviswesh@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
snowpad = "snowpad.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
